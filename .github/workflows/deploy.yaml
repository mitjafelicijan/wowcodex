name: Build and Deploy to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove development files
        run: rm -rf tools Makefile makext.mk README.md
      - name: Inject Version into JS and HTML
        run: |
          # Inject version into fetch calls in JS files
          find . -type f -name "*.js" -exec sed -i "s/data.json/data.json?v=${{ github.sha }}/g" {} +
          find . -type f -name "*.js" -exec sed -i "s/manifest.json/manifest.json?v=${{ github.sha }}/g" {} +
          
          # Inject version into script tags in HTML files
          find . -type f -name "*.html" -exec sed -i "s/\.js\"/\.js?v=${{ github.sha }}\"/g" {} +
      - name: Verify Injection
        run: |
          echo "Checking for version in dungeon-gear/app.js:"
          grep "data.json?v=" dungeon-gear/app.js || echo "Injection failed for app.js"
          echo "Checking for version in dungeon-gear/index.html:"
          grep "app.js?v=" dungeon-gear/index.html || echo "Injection failed for index.html"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
